<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPL 儀表板 · 日翊文化行銷</title>
<link rel="stylesheet" href="css/base.css?v=20260518-6">
<link rel="stylesheet" href="css/layout.css?v=20260518-6">
<link rel="stylesheet" href="css/widget.css?v=20260518-6">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- Top App Bar -->
<header class="topbar">

  <!-- 左側：漢堡 + 一級分類 Tabs -->
  <div class="topbar-left">
    <button class="topbar-hamburger" id="menu-toggle" onclick="toggleSidebar()" aria-label="切換選單">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor" aria-hidden="true">
        <rect width="18" height="2" rx="1"/>
        <rect y="6" width="18" height="2" rx="1"/>
        <rect y="12" width="18" height="2" rx="1"/>
      </svg>
    </button>
    <nav class="topbar-center" id="topbar-tabs" aria-label="主功能分類"></nav>
  </div>

  <!-- 右側：通知 + 使用者 -->
  <div class="topbar-right">
    <button class="topbar-icon-btn" id="notif-btn" aria-label="通知">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="topbar-notif-dot"></span>
    </button>

    <div class="topbar-user-wrap">
      <button class="topbar-user-btn" id="user-btn" onclick="toggleUserMenu()">
        <div class="topbar-user-avatar" id="topbar-user-avatar">👤</div>
        <span class="topbar-user-name" id="topbar-user-name">使用者</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="currentColor" aria-hidden="true">
          <path d="M0 0l5 6 5-6z"/>
        </svg>
      </button>
      <!-- 使用者下拉選單 -->
      <div class="topbar-user-menu" id="user-menu" hidden>
        <div class="topbar-user-menu-header">
          <div class="topbar-user-menu-name" id="um-name">使用者</div>
          <div class="topbar-user-menu-role" id="um-role">日翊文化行銷</div>
        </div>
        <div class="topbar-user-menu-divider"></div>
        <button class="topbar-user-menu-item topbar-user-menu-logout" onclick="logout()">
          <span>⏻</span> 登出
        </button>
      </div>
    </div>
  </div>

</header>

<!-- 側欄遮罩（手機用，點擊關閉側欄） -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- 主容器 -->
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<!-- Toast 通知 -->
<div class="toast" id="toast"></div>

<!-- 子頁面模板（內嵌） -->
<script id="tpl-daily" type="text/html">
<div class="page-head">
  <div class="page-eyebrow">DAILY BUDGET MONITOR</div>
  <h1 class="page-h">每日動支監控</h1>
  <div class="page-p" id="page-meta">載入中…</div>
</div>

<div class="filter-bar">
  <span class="filter-label">日期區間</span>
  <input type="date" class="filter-input" id="filter-from">
  <span class="range-arrow">→</span>
  <input type="date" class="filter-input" id="filter-to">
  <div class="filter-divider"></div>
  <button class="btn btn-primary" onclick="applyFilter()">套用</button>
  <span class="filter-meta" id="filter-meta"></span>
</div>

<div class="grid" id="daily-grid"></div>

</script>

<script id="tpl-dispatch" type="text/html">
<div class="page-head">
  <div class="page-eyebrow">TOTAL DISPATCH RATE · 總費用動支</div>
  <h1 class="page-h">總費用動支率</h1>
  <div class="page-p" id="dispatch-meta">載入中…</div>
</div>
<div class="filter-bar">
  <span class="filter-label">日期區間</span>
  <input type="date" class="filter-input" id="dispatch-from">
  <span class="range-arrow">→</span>
  <input type="date" class="filter-input" id="dispatch-to">
  <div class="filter-divider"></div>
  <button class="btn btn-primary" onclick="applyDispatchFilter()">套用</button>
  <span class="filter-meta">🔗 與其他頁共用日期設定</span>
</div>
<div class="grid" id="dispatch-grid"></div>
</script>

<script id="tpl-freight" type="text/html">
<div class="page-head">
  <div class="page-eyebrow">FREIGHT P&amp;L · 運費損益</div>
  <h1 class="page-h">運費損益分析</h1>
  <div class="page-p" id="freight-meta">載入中…</div>
</div>
<div class="filter-bar">
  <span class="filter-label">日期區間</span>
  <input type="date" class="filter-input" id="freight-from">
  <span class="range-arrow">→</span>
  <input type="date" class="filter-input" id="freight-to">
  <div class="filter-divider"></div>
  <button class="btn btn-primary" onclick="applyFreightFilter()">套用</button>
  <span class="filter-meta">🔗 與其他頁共用日期設定</span>
</div>
<div class="grid" id="freight-grid"></div>
</script>

<script id="tpl-productivity" type="text/html">
<div class="page-head">
  <div class="page-eyebrow">PICKING PRODUCTIVITY · 揀次人效分析</div>
  <h1 class="page-h">揀次人效分析</h1>
  <div class="page-p" id="productivity-meta">整合揀次、工時、成本與區域效率</div>
</div>
<div class="filter-bar">
  <span class="filter-label">日期區間</span>
  <input type="date" class="filter-input" id="productivity-from">
  <span class="range-arrow">→</span>
  <input type="date" class="filter-input" id="productivity-to">
  <div class="filter-divider"></div>
  <button class="btn btn-primary" onclick="applyDashboardDateFilter('productivity')">套用</button>
  <span class="filter-meta" id="productivity-date-meta"></span>
</div>
<div class="grid" id="productivity-grid"></div>
</script>

<script id="tpl-monthly" type="text/html">
<div class="page-head">
  <div class="page-eyebrow">MONTHLY SETTLEMENT · 月度結算</div>
  <h1 class="page-h">月度結算</h1>
  <div class="page-p" id="monthly-meta">月底結算時使用的本月口袋總結頁面</div>
</div>
<div class="filter-bar">
  <span class="filter-label">日期區間</span>
  <input type="date" class="filter-input" id="monthly-from">
  <span class="range-arrow">→</span>
  <input type="date" class="filter-input" id="monthly-to">
  <div class="filter-divider"></div>
  <button class="btn btn-primary" onclick="applyDashboardDateFilter('monthly')">套用</button>
  <span class="filter-meta" id="monthly-date-meta"></span>
</div>
<div class="grid" id="monthly-grid"></div>
</script>

<script id="tpl-annual" type="text/html">
<div class="page-head">
  <div class="page-eyebrow">ANNUAL PLAN · 年度規劃分析</div>
  <h1 class="page-h">年度規劃分析</h1>
  <div class="page-p">全年 12 個月預算 vs 實際費用對照（人力費用 / 運務費用）</div>
</div>
<div class="grid" id="annual-grid"></div>
</script>

<script id="tpl-import" type="text/html">
<div class="page-head">
  <div class="page-eyebrow">DATA IMPORT · 資料匯入</div>
  <h1 class="page-h">Excel 資料匯入</h1>
  <div class="page-p">上傳 Excel 後自動解析，即時更新儀表板數字</div>
</div>
<div class="w import-status-panel">
  <div class="wh">
    <div class="wl"><div class="wdot"></div>目前儀表板資料狀態</div>
  </div>
  <table class="tbl status-table">
    <thead><tr>
      <th>資料類型</th>
      <th>狀態</th>
      <th>最新資料日期</th>
      <th>最舊資料日期</th>
    </tr></thead>
    <tbody id="status-tbody"></tbody>
  </table>
</div>
<div class="import-list">
  <div class="w import-row">
    <div class="import-accent import-accent-budget"></div>
    <div class="import-info">
      <div class="import-kicker">💰 年度預算（總費用動支率）</div>
      <div class="wl"><div class="wdot dot-budget"></div>人力預算 + 運費預算</div>
      <div class="import-note">
        <div>年度預算V2：分頁「人力」「運務」，欄位含 1月～12月</div>
        <div>仍相容舊版：人力預算_轉換、運費預算_轉換</div>
      </div>
    </div>
    <div class="import-drop-wrap">
    <div id="budget-drop"
      class="import-drop"
      onclick="document.getElementById('budget-file').click()"
      ondragover="onDragOver(event,'budget-drop')"
      ondragleave="onDragLeave('budget-drop')"
      ondrop="onDrop(event,'budget')">
      <div class="import-drop-icon">💰</div>
      <div class="import-drop-title">點擊或拖曳 Excel 至此</div>
      <div class="import-drop-hint">.xlsx 格式｜建議使用：年度預算V2.xlsx</div>
    </div>
    <input type="file" id="budget-file" accept=".xlsx,.xls" style="display:none" onchange="onFileSelect(event,'budget')">
    </div>
    <div class="import-actions">
      <span class="wmeta" id="budget-status">尚未上傳</span>
    <div id="budget-preview" class="import-preview" style="display:none"></div>
    <div id="budget-btns" class="import-btns" style="display:none">
      <button class="btn btn-primary" onclick="applyBudget()">✅ 套用到儀表板</button>
      <button class="btn btn-ghost" onclick="resetBudget()">↺ 重選</button>
    </div>
    </div>
  </div>
  <div class="w import-row">
    <div class="import-accent import-accent-freight"></div>
    <div class="import-info">
      <div class="import-kicker">🚚 運務費用（F002-F003 / F010 / T002 / T003）</div>
      <div class="wl"><div class="wdot dot-freight"></div>每日各倉運務費用</div>
      <div class="import-note">
        <div>彙總分頁：列標籤（民國日期）｜大肚倉｜大溪倉｜岡山倉｜總計</div>
        <div>明細分頁：進貨日｜倉別｜配送商｜預計計價結果｜到點計價結果｜計價結果</div>
      </div>
    </div>
    <div class="import-drop-wrap">
    <div id="freight-drop"
      class="import-drop"
      onclick="document.getElementById('freight-file').click()"
      ondragover="onDragOver(event,'freight-drop')"
      ondragleave="onDragLeave('freight-drop')"
      ondrop="onDrop(event,'freight')">
      <div class="import-drop-icon">📊</div>
      <div class="import-drop-title">點擊或拖曳 Excel 至此</div>
      <div class="import-drop-hint">.xlsx 格式｜需含：進貨日與計價費用、貨運費用明細總表</div>
    </div>
    <input type="file" id="freight-file" accept=".xlsx,.xls" style="display:none" onchange="onFileSelect(event,'freight')">
    </div>
    <div class="import-actions">
      <span class="wmeta" id="freight-status">尚未上傳</span>
    <div id="freight-preview" class="import-preview" style="display:none"></div>
    <div id="freight-btns" class="import-btns" style="display:none">
      <button class="btn btn-primary" onclick="applyFreight()">✅ 套用到儀表板</button>
      <button class="btn btn-gold" onclick="downloadFreight()">⬇️ 下載彙總確認檔</button>
      <button class="btn btn-ghost" onclick="resetFreight()">↺ 重選</button>
    </div>
    </div>
  </div>
  <div class="w import-row">
    <div class="import-accent import-accent-labor"></div>
    <div class="import-info">
      <div class="import-kicker">⏱ 工時資料（總費用動支率 / 工時結構）</div>
      <div class="wl"><div class="wdot dot-labor"></div>全區人力工時明細</div>
      <div class="import-note">
        <div>必要欄位：倉別｜日期｜廠商｜班別｜員編｜作業課別｜姓名｜作業區域｜作業時數｜實際費用</div>
        <div>一次最多匯入 31 天｜系統自動讀取分頁中的資料日期｜歷年資料後續由 GCP 管理</div>
      </div>
    </div>
    <div class="import-drop-wrap">
    <div id="labor-drop"
      class="import-drop"
      onclick="document.getElementById('labor-file').click()"
      ondragover="onDragOver(event,'labor-drop')"
      ondragleave="onDragLeave('labor-drop')"
      ondrop="onDrop(event,'labor')">
      <div class="import-drop-icon">⏱</div>
      <div class="import-drop-title">點擊或拖曳 Excel 至此</div>
      <div class="import-drop-hint">.xlsx 格式｜一次最多 31 天</div>
    </div>
    <input type="file" id="labor-file" accept=".xlsx,.xls" style="display:none" onchange="onFileSelect(event,'labor')">
    </div>
    <div class="import-actions">
      <span class="wmeta" id="labor-status">尚未上傳</span>
    <div id="labor-preview" class="import-preview" style="display:none"></div>
    <div id="labor-btns" class="import-btns" style="display:none">
      <button class="btn btn-primary" onclick="applyLabor()">✅ 套用到儀表板</button>
      <button class="btn btn-ghost" onclick="resetLabor()">↺ 重選</button>
    </div>
    </div>
  </div>
  <div class="w import-row">
    <div class="import-accent import-accent-picks"></div>
    <div class="import-info">
      <div class="import-kicker">⚡ 揀次資料（揀次分析）</div>
      <div class="wl"><div class="wdot dot-picks"></div>三倉每日揀次明細</div>
      <div class="import-note">
        <div>必要欄位：倉別｜日期｜業務類別｜作業區｜工時區域｜揀次</div>
      </div>
    </div>
    <div class="import-drop-wrap">
    <div id="picks-drop"
      class="import-drop"
      onclick="document.getElementById('picks-file').click()"
      ondragover="onDragOver(event,'picks-drop')"
      ondragleave="onDragLeave('picks-drop')"
      ondrop="onDrop(event,'picks')">
      <div class="import-drop-icon">⚡</div>
      <div class="import-drop-title">點擊或拖曳 Excel 至此</div>
      <div class="import-drop-hint">.xlsx 格式｜與 貨量揀次.xlsx 相同欄位</div>
    </div>
    <input type="file" id="picks-file" accept=".xlsx,.xls" style="display:none" onchange="onFileSelect(event,'picks')">
    </div>
    <div class="import-actions">
      <span class="wmeta" id="picks-status">尚未上傳</span>
    <div id="picks-preview" class="import-preview" style="display:none"></div>
    <div id="picks-btns" class="import-btns" style="display:none">
      <button class="btn btn-primary" onclick="applyPicks()">✅ 套用到儀表板</button>
      <button class="btn btn-ghost" onclick="resetPicks()">↺ 重選</button>
    </div>
    </div>
  </div>
</div>
</script>

<script id="tpl-org" type="text/html">
<div class="page-head org-page-head">
  <div>
    <div class="page-eyebrow">ORG SETTINGS · 組織設定</div>
    <h1 class="page-h">組織設定</h1>
    <div class="page-p">點擊任一列進行編輯</div>
  </div>
  <button class="btn btn-primary org-save-btn" onclick="saveOrgSettings()">儲存設定</button>
</div>
<div class="grid" id="org-grid"></div>
</script>

<script id="tpl-typography" type="text/html">
<div class="page-head org-page-head">
  <div>
    <div class="page-eyebrow">SYSTEM SETTINGS · 文字樣式設定</div>
    <h1 class="page-h">文字樣式設定</h1>
    <div class="page-p">調整全站文字層級，並即時預覽套用效果</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="btn btn-ghost" onclick="resetTypographySettings()">重設預設值</button>
    <button class="btn btn-primary org-save-btn" onclick="saveTypographySettings()">儲存設定</button>
  </div>
</div>
<div class="grid" id="typography-grid"></div>
</script>

<script id="tpl-picks" type="text/html">
<div class="page-head">
  <div class="page-eyebrow">PICKS ANALYSIS · 揀次分析</div>
  <h1 class="page-h">揀次分析</h1>
  <div class="page-p" id="picks-meta">載入中…</div>
</div>
<div class="filter-bar">
  <span class="filter-label">日期區間</span>
  <input type="date" class="filter-input" id="picks-from">
  <span class="range-arrow">→</span>
  <input type="date" class="filter-input" id="picks-to">
  <div class="filter-divider"></div>
  <button class="btn btn-primary" onclick="applyDashboardDateFilter('picks')">套用</button>
  <span class="filter-meta" id="picks-date-meta"></span>
</div>
<div class="filter-bar">
  <span class="filter-label">倉庫</span>
  <select class="filter-input" id="picks-wh" onchange="renderPicksPage()">
    <option value="">全部倉庫</option>
    <option value="大肚倉">大肚倉</option>
    <option value="大溪倉">大溪倉</option>
    <option value="岡山倉">岡山倉</option>
  </select>
  <div class="filter-divider"></div>
  <span class="filter-label">作業區域</span>
  <select class="filter-input" id="picks-op" onchange="renderPicksPage()">
    <option value="">全部</option>
    <option value="夜配理貨">夜配理貨</option>
    <option value="夜配裝箱">夜配裝箱</option>
    <option value="日配理貨">日配理貨</option>
    <option value="日配裝箱">日配裝箱</option>
    <option value="分揀理貨">分揀理貨</option>
    <option value="人工驗收">人工驗收</option>
    <option value="自動驗收">自動驗收</option>
    <option value="O2O理貨">O2O理貨</option>
    <option value="店訂理貨">店訂理貨</option>
    <option value="團預購理貨">團預購理貨</option>
    <option value="EC店退">EC店退</option>
    <option value="EC廠退">EC廠退</option>
    <option value="一般品退貨">一般品退貨</option>
    <option value="大夜作業">大夜作業</option>
  </select>
</div>
<div class="grid" id="picks-grid"></div>
</script>

<script id="tpl-labor" type="text/html">
<div class="page-head">
  <div class="page-eyebrow">LABOR ANALYSIS · 人力工時結構</div>
  <h1 class="page-h">人力工時結構</h1>
  <div class="page-p" id="labor-meta">載入中…</div>
</div>
<div class="filter-bar">
  <span class="filter-label">日期區間</span>
  <input type="date" class="filter-input" id="labor-from">
  <span class="range-arrow">→</span>
  <input type="date" class="filter-input" id="labor-to">
  <div class="filter-divider"></div>
  <button class="btn btn-primary" onclick="applyDashboardDateFilter('labor')">套用</button>
  <span class="filter-meta" id="labor-date-meta"></span>
</div>
<div class="filter-bar">
  <span class="filter-label">班別</span>
  <select class="filter-input" id="labor-shift" onchange="renderLaborPage()">
    <option value="">全部班別</option>
    <option value="日">日班</option>
    <option value="中">中班</option>
    <option value="夜">夜班</option>
  </select>
  <div class="filter-divider"></div>
  <span class="filter-label">課別</span>
  <select class="filter-input" id="labor-vendor" onchange="renderLaborPage()">
    <option value="">全部課別</option>
  </select>
  <div class="filter-divider"></div>
  <span class="filter-meta" id="labor-filter-meta"></span>
</div>
<div class="grid" id="labor-grid"></div>
</script>

<!-- JS 載入順序：picks/labor data → data → utils → widgets → app -->
<script src="js/picks_data.js?v=20260504-3"></script>
<script src="js/labor_data.js?v=20260504-3"></script>
<script src="js/data.js?v=20260509-1"></script>

const PAGE_TEMPLATES = {

  productivity:   document.getElementById('tpl-productivity').innerHTML,
  monthly:        document.getElementById('tpl-monthly').innerHTML,

</body>
</html>
